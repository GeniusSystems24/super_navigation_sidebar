name: super_navigation_sidebar
description: >
  A themeable, responsive navigation sidebar for Flutter with expanded, rail,
  and drawer modes, typed NavNode<T> trees, search, favorites, recents, state
  persistence, localization, RTL support, and a reusable NavigationSearchView
  that opens as a dialog or modal bottom sheet.

version: 3.0.1

homepage: https://github.com/GeniusSystems24/super_navigation_sidebar
repository: https://github.com/GeniusSystems24/super_navigation_sidebar
issue_tracker: https://github.com/GeniusSystems24/super_navigation_sidebar/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Shared GeniusLink design-system foundation — provides SuperMaterialThemeData
  # / SuperThemeData so the sidebar derives palette-, brightness- and
  # device-mode-aware tokens automatically via
  # NavigationSidebarThemeData.fromMaterialTheme (super_core 3.3.0+).
  super_core: ">=3.6.0 <4.0.0"
  # Shared GeniusLink form-field foundation used by NavigationSearchView.
  super_form_field: ">=1.11.1 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
