name: super_navigation_sidebar
description: >
  A themeable, responsive app navigation sidebar for Flutter. Three modes —
  expanded tree with connectors, icon-only rail with hover flyouts, and
  off-canvas drawer with scrim. Typed NavNode<T> tree, badges, working
  shortcut chords, screen-code search, recents, state persistence,
  header/footer slots, RTL, localization, accessibility, AppBar integration,
  and an integrated NavigationShell (app bar + pane + content).
  Depends only on the first-party super_core design-system foundation.

version: 2.3.0

homepage: https://github.com/GeniusSystems24/super_navigation_sidebar
repository: https://github.com/GeniusSystems24/super_navigation_sidebar
issue_tracker: https://github.com/GeniusSystems24/super_navigation_sidebar/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Shared GeniusLink design-system foundation — provides SuperMaterialThemeData
  # / SuperThemeData so the sidebar derives palette-, brightness- and
  # device-mode-aware tokens automatically via
  # NavigationSidebarThemeData.fromMaterialTheme (v2.3.0).
  super_core: ">=1.2.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
